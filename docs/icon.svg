<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030603" />
      <stop offset="55%" stop-color="#050805" />
      <stop offset="100%" stop-color="#0a160a" />
    </linearGradient>
    <linearGradient id="matrixGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccffda" />
