    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#matrixBg)" />
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="url(#matrixGreen)" stroke-width="6" stroke-opacity="0.55" />

