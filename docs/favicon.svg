<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.4"/>
  <!-- Ambient Core Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#cyanGrad)" opacity="0.12" filter="url(#glow)"/>
  <!-- Stylized Geometric S B S Monogram -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Hex Tech Orbit -->
    <path d="M256 96 L396 176 L396 336 L256 416 L116 336 L116 176 Z" stroke="url(#goldGrad)" stroke-width="12" opacity="0.85"/>
    <!-- Center Tech Core Nodes -->
    <circle cx="256" cy="96" r="14" fill="#F59E0B"/>
    <circle cx="396" cy="176" r="14" fill="#38BDF8"/>
    <circle cx="396" cy="336" r="14" fill="#F59E0B"/>
    <circle cx="256" cy="416" r="14" fill="#10B981"/>
    <circle cx="116" cy="336" r="14" fill="#38BDF8"/>
    <circle cx="116" cy="176" r="14" fill="#F59E0B"/>
  </g>
  <!-- Bold SBS Typographic Mark -->
  <text x="256" y="280" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="108" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4" filter="url(#glow)">SBS</text>
  <text x="256" y="330" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="6">SOLUTIONS</text>
</svg>
